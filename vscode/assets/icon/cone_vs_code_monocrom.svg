  <circle cx="702" cy="126" r="20" fill="currentColor" />

  <path d="M 542 168 C 588 135, 628 122, 665 118" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" />

  <!-- ==================== BALÃO DE CONVERSAÇÃO (INFERIOR DIREITO) ==================== -->
  <path d="M 625 468 
           L 668 468 
           C 708 468, 730 495, 730 538 
           L 730 605 
           C 730 638, 708 658, 682 664 
           L 682 726 
