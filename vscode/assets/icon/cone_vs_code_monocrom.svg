  <circle cx="398" cy="768" r="21" fill="currentColor" />

  <polyline points="354,650 354,680 315,718" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="308" cy="725" r="20" fill="currentColor" />

