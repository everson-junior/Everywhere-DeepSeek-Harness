  <circle cx="360" cy="534" r="12" fill="none" stroke="currentColor" stroke-width="10" />
  <line x1="360" y1="548" x2="360" y2="625" stroke="currentColor" stroke-width="13" stroke-linecap="round" />
  
  <polyline points="315,530 315,585" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" />

  <line x1="434" y1="475" x2="434" y2="520" stroke="currentColor" stroke-width="13" stroke-linecap="round" />
  <circle cx="434" cy="534" r="12" fill="none" stroke="currentColor" stroke-width="10" />
  <line x1="434" y1="548" x2="434" y2="625" stroke="currentColor" stroke-width="13" stroke-linecap="round" />
  
  <polyline points="472,600 472,532 490,515" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />

