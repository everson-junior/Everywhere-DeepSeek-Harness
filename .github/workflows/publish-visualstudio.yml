name: Publish Visual Studio Extension

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do release (ex: 0.1.0 - deixe em branco para usar a tag ou manifesto)'
        required: false
        default: ''
      publish_marketplace:
        description: 'Publicar no Visual Studio Marketplace?'
        required: false
        type: boolean
        default: true

concurrency:
  group: publish-visualstudio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Visual Studio VSIX
    runs-on: windows-latest
    env:
      VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $inputVer = "${{ github.event.inputs.version }}"
          $refName = "${{ github.ref_name }}"
          $manifestPath = "visualstudio/Everywhere/source.extension.vsixmanifest"

          [xml]$xml = Get-Content $manifestPath
          $manifestVer = $xml.PackageManifest.Metadata.Identity.Version

          if ($inputVer -and $inputVer.Trim() -ne "") {
            $ver = $inputVer.Trim().TrimStart('v')
          } elseif ($refName -match '^v?[0-9]+\.[0-9]+\.[0-9]+') {
            $ver = $refName.TrimStart('v')
          } else {
            $ver = $manifestVer
          }

          # Atualiza APENAS o atributo Version da tag <Identity>, preservando PackageManifest Version="2.0.0"
          $content = Get-Content $manifestPath -Raw
          $content = [regex]::Replace($content, '(<Identity\b[^>]*?\bVersion=")[^"]+(")', "`${1}$ver`${2}")
          Set-Content -Path $manifestPath -Value $content -NoNewline

          echo "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "🏷️ Versão resolvida para publicação: $ver"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages for Everywhere.sln
        run: msbuild visualstudio/Everywhere.sln /t:Restore

      - name: Build Everywhere.sln (Release)
        run: msbuild visualstudio/Everywhere.sln /p:Configuration=Release /p:VisualStudioVersion=17.0 /p:DeployExtension=false /p:CreateVsixContainer=true /p:Version=${{ steps.version.outputs.version }} /p:VsixVersion=${{ steps.version.outputs.version }} /v:normal

      - name: Package VSIX (fallback if MSBuild did not emit container directly)
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $existingVsix = Get-ChildItem -Path visualstudio -Filter *.vsix -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($existingVsix) {
            Write-Host "VSIX already produced by MSBuild: $($existingVsix.FullName) ($($existingVsix.Length) bytes)"
            exit 0
          }

          Write-Host "MSBuild did not emit .vsix container directly. Packaging fallback VSIX..."
          $out = Get-ChildItem -Path visualstudio/Everywhere/bin -Recurse -Filter Everywhere.dll | Select-Object -First 1
          if (-not $out) { throw "Everywhere.dll not found in build output!" }
          $dir = $out.DirectoryName
          $stage = Join-Path $PWD "vsix-stage"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Assemblies do projeto e dependências diretas de runtime
          Get-ChildItem -Path $dir -File | Where-Object {
            $_.Extension -in '.dll' -and
            $_.Name -notlike 'Microsoft.VisualStudio.*' -and
            $_.Name -notlike 'Microsoft.VSSDK.*' -and
            $_.Name -notlike 'Microsoft.ServiceHub.*' -and
            $_.Name -notlike 'Microsoft.Build.*' -and
            $_.Name -notlike 'StreamJsonRpc*' -and
            $_.Name -notlike 'VSLangProj*' -and
            $_.Name -notlike 'envdte*'
          } | Copy-Item -Destination $stage

          if (Test-Path "$dir/runtimes") {
            Copy-Item -Path "$dir/runtimes" -Destination $stage -Recurse -Force
          }

          if (Test-Path "$dir/Everywhere.pkgdef") {
            Copy-Item "$dir/Everywhere.pkgdef" $stage
          } else {
            Copy-Item visualstudio/Everywhere/Everywhere.pkgdef $stage
          }
          Copy-Item visualstudio/Everywhere/LICENSE.txt $stage
          New-Item -ItemType Directory -Force -Path "$stage/Resources" | Out-Null
          Copy-Item visualstudio/Everywhere/Resources/*.png "$stage/Resources"

          Copy-Item visualstudio/Everywhere/source.extension.vsixmanifest (Join-Path $stage 'extension.vsixmanifest')

          $utf8WithBom = New-Object System.Text.UTF8Encoding($true)
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $ct = '<?xml version="1.0" encoding="utf-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="vsixmanifest" ContentType="text/xml" /><Default Extension="json" ContentType="application/json" /><Default Extension="dll" ContentType="application/octet-stream" /><Default Extension="pkgdef" ContentType="text/plain" /><Default Extension="png" ContentType="application/octet-stream" /><Default Extension="txt" ContentType="text/plain" /></Types>'
          [System.IO.File]::WriteAllText((Join-Path $stage '[Content_Types].xml'), $ct, $utf8WithBom)

          $allFiles = Get-ChildItem -Path $stage -Recurse -File | Where-Object { $_.Name -ne '[Content_Types].xml' }
          $totalSize = ($allFiles | Measure-Object -Property Length -Sum).Sum
          if ($totalSize -le 0) { $totalSize = 1048576 }

          $fileList = @()
          foreach ($f in $allFiles) {
            $rel = "/" + $f.FullName.Substring($stage.Length).TrimStart('\', '/').Replace('\', '/')
            $fileList += [ordered]@{ fileName = $rel; sha256 = $null }
          }

          $manifestObj = [ordered]@{
            id = "Everywhere.DeepSeek.VSIX"
            version = $ver
            type = "Vsix"
            vsixId = "Everywhere.DeepSeek.VSIX"
            extensionDir = "[installdir]\Common7\IDE\Extensions\Everywhere"
            files = $fileList
            installSizes = [ordered]@{
              targetDrive = [int64]$totalSize
            }
            dependencies = [ordered]@{
              "Microsoft.VisualStudio.Component.CoreEditor" = "17.0"
            }
          }
          $manifestJson = $manifestObj | ConvertTo-Json -Depth 5 -Compress
          [System.IO.File]::WriteAllText((Join-Path $stage 'manifest.json'), $manifestJson, $utf8NoBom)

          $catalogObj = [ordered]@{
            manifestVersion = "1.1"
            info = [ordered]@{
              id = "Everywhere.DeepSeek.VSIX,version=$ver"
              manifestType = "Extension"
            }
            packages = @(
              [ordered]@{
                id = "Component.Everywhere.DeepSeek.VSIX"
                version = $ver
                type = "Component"
                extension = $true
                dependencies = [ordered]@{
                  "Everywhere.DeepSeek.VSIX" = $ver
                  "Microsoft.VisualStudio.Component.CoreEditor" = "17.0"
                }
                localizedResources = @(
                  [ordered]@{
                    language = "en-US"
                    title = "Everywhere DeepSeek Harness"
                    description = "Connect Visual Studio 2022 to the official DeepSeek Harness autonomous AI agent runtime."
                  }
                )
              },
              [ordered]@{
                id = "Everywhere.DeepSeek.VSIX"
                version = $ver
                type = "Vsix"
                payloads = @(
                  [ordered]@{
                    fileName = "everywhere-visualstudio-$ver.vsix"
                    size = [int64]$totalSize
                  }
                )
                vsixId = "Everywhere.DeepSeek.VSIX"
                extensionDir = "[installdir]\Common7\IDE\Extensions\Everywhere"
                installSizes = [ordered]@{
                  targetDrive = [int64]$totalSize
                }
              }
            )
          }
          $catalogJson = $catalogObj | ConvertTo-Json -Depth 5 -Compress
          [System.IO.File]::WriteAllText((Join-Path $stage 'catalog.json'), $catalogJson, $utf8NoBom)

          $dest = "visualstudio/Everywhere/bin/Release/everywhere-visualstudio-$ver.vsix"
          $destDir = Split-Path (Join-Path $PWD $dest)
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $destPath = Join-Path $PWD $dest
          if (Test-Path $destPath) { Remove-Item $destPath -Force }

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zipStream = [System.IO.File]::Create($destPath)
          $archive = New-Object System.IO.Compression.ZipArchive($zipStream, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            Get-ChildItem -Path $stage -Recurse -File | ForEach-Object {
              $rel = $_.FullName.Substring($stage.Length).TrimStart('\', '/').Replace('\', '/')
              $entry = $archive.CreateEntry($rel, [System.IO.Compression.CompressionLevel]::Optimal)
              $entryStream = $entry.Open()
              try {
                $fileStream = [System.IO.File]::OpenRead($_.FullName)
                try {
                  $fileStream.CopyTo($entryStream)
                } finally {
                  $fileStream.Dispose()
                }
              } finally {
                $entryStream.Dispose()
              }
            }
          } finally {
            $archive.Dispose()
            $zipStream.Dispose()
          }
          Write-Host "Fallback VSIX criado com sucesso em: $dest"

      - name: Confirm and standardize VSIX artifact path
        id: locate-vsix
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $vsixFiles = Get-ChildItem -Path visualstudio -Filter *.vsix -Recurse
          if ($vsixFiles.Count -eq 0) {
            throw "Erro: Nenhum arquivo .vsix encontrado após a compilação de Everywhere.sln!"
          }

          $mainVsix = $vsixFiles[0]
          $targetName = "everywhere-visualstudio-$ver.vsix"
          $finalPath = Join-Path $mainVsix.DirectoryName $targetName
          if ($mainVsix.FullName -ne $finalPath) {
            Rename-Item -LiteralPath $mainVsix.FullName -NewName $targetName -Force
          }

          Write-Host "📦 Artefato VSIX gerado: $finalPath ($((Get-Item $finalPath).Length) bytes)"
          echo "vsix_path=$finalPath" >> $env:GITHUB_OUTPUT

      - name: Validate Identity from manifest
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content "visualstudio/Everywhere/source.extension.vsixmanifest"
          $manifestIdentityId = $manifest.PackageManifest.Metadata.Identity.Id
          $manifestPublisher = $manifest.PackageManifest.Metadata.Identity.Publisher
          $manifestDisplayName = $manifest.PackageManifest.Metadata.DisplayName

          Write-Host "Manifest Display Name : $manifestDisplayName"
          Write-Host "Manifest Identity ID  : $manifestIdentityId"
          Write-Host "Manifest Publisher    : $manifestPublisher"

          $pubManifest = Get-Content "visualstudio/publishManifest.json" -Raw | ConvertFrom-Json
          Write-Host "publishManifest internalName: $($pubManifest.identity.internalName)"
          Write-Host "publishManifest publisher   : $($pubManifest.publisher)"

          if ($pubManifest.identity.internalName -ne $manifestIdentityId) {
            throw "Erro de consistência: publishManifest internalName ($($pubManifest.identity.internalName)) deve coincidir com o Identity ID do vsixmanifest ($manifestIdentityId), e não com o DisplayName!"
          }
          if ($pubManifest.publisher -ne $manifestPublisher) {
            throw "Erro de consistência: publisher em publishManifest.json ($($pubManifest.publisher)) difere do Publisher em source.extension.vsixmanifest ($manifestPublisher)!"
          }
          Write-Host "✅ Identidade do VSIX validada com sucesso!"

      - name: Upload VSIX as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: everywhere-visualstudio-${{ steps.version.outputs.version }}-vsix
          path: visualstudio/**/*.vsix
          if-no-files-found: error
          retention-days: 30

      - name: Attach VSIX to GitHub Release Assets
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: visualstudio/**/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Visual Studio Marketplace
        if: ${{ env.VS_MARKETPLACE_TOKEN != '' && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish_marketplace != false) }}
        shell: pwsh
        run: |
          $vsixFile = "${{ steps.locate-vsix.outputs.vsix_path }}"
          if (-not (Test-Path $vsixFile)) {
            $vsixFile = (Get-ChildItem -Path visualstudio -Filter *.vsix -Recurse | Select-Object -First 1).FullName
          }
          Write-Host "🚀 Iniciando publicação no Visual Studio Marketplace com VsixPublisher..."
          Write-Host "Payload: $vsixFile"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $vsixPublisher = Join-Path $vsPath "VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe"
          if (-not (Test-Path $vsixPublisher)) {
            $found = Get-ChildItem -Path "$vsPath\VSSDK" -Filter "VsixPublisher.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $vsixPublisher = $found.FullName
            } else {
              throw "VsixPublisher.exe não foi encontrado na instalação do Visual Studio em $vsPath!"
            }
          }
          Write-Host "Localizado VsixPublisher: $vsixPublisher"

          & $vsixPublisher publish `
            -payload "$vsixFile" `
            -publishManifest "visualstudio/publishManifest.json" `
            -personalAccessToken "$env:VS_MARKETPLACE_TOKEN" `
            -ignoreWarnings "VSIXValidatorWarning01,VSIXValidatorWarning02"

          if ($LASTEXITCODE -ne 0) {
            throw "Publicação falhou com código de saída $LASTEXITCODE"
          }
          Write-Host "✅ Publicação no Visual Studio Marketplace concluída com sucesso!"

      - name: Marketplace Notice (quando VS_MARKETPLACE_TOKEN não estiver configurado)
        if: ${{ env.VS_MARKETPLACE_TOKEN == '' && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish_marketplace != false) }}
        shell: pwsh
        run: |
          Write-Host "::notice title=Visual Studio Marketplace Skipped::O artefato .vsix foi gerado e validado com sucesso. Para publicar automaticamente no Visual Studio Marketplace, configure o secret 'VS_MARKETPLACE_TOKEN' em Settings -> Secrets and variables -> Actions no repositório GitHub."
