  <path d="M 675 310 C 785 375, 785 435, 710 470" fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="round" />
  <circle cx="766" cy="408" r="22" fill="currentColor" />

  <!-- Pontos Orbitais -->
  <circle cx="105" cy="285" r="11" fill="currentColor" />
  <circle cx="62" cy="485" r="11" fill="currentColor" />
  <circle cx="155" cy="542" r="12" fill="currentColor" />
  <circle cx="695" cy="425" r="12" fill="currentColor" />

