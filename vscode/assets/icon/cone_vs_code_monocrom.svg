  <path d="M 398 265 C 430 195, 520 175, 588 210" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" />

  <path d="M 628 245 C 685 335, 650 455, 535 562 L 398 662 L 292 568" fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

